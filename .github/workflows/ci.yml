name: APP3 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    uses: nesco-devops/Action3/.github/workflows/docker-build-push.yml@main
    with:
      image_name: app3
      build_context: .
      dockerfile: ./Dockerfile
      gitops_manifest: app3/deployment.yaml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
